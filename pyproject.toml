[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pguard"
version = "0.1.0"
description = "Privacy-first Wi-Fi safety and wellbeing monitor (Tier 1: RSSI presence, motion, inactivity)"
requires-python = ">=3.12"
dependencies = []  # standard library only; service dependencies arrive with the API phase

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7"]
docs = ["matplotlib>=3.9"]

[project.scripts]
pguard = "pguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
